services:
  db:
    image: postgres:15-alpine
    container_name: 3d_tour_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: password
      POSTGRES_DB: virtual_tours
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d virtual_tours"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  minio:
    image: minio/minio
    container_name: 3d_tour_minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_SERVER_URL: "http://197.140.41.131"
      MINIO_BROWSER_REDIRECT_URL: "http://197.140.41.131/minio-console"
    command: server /data --console-address ":9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  minio-init:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    restart: on-failure
    entrypoint: >
      /bin/sh -c "
      echo 'Configuring MinIO client...' &&
      /usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadmin &&
      /usr/bin/mc mb myminio/virtual-tours --ignore-existing &&
      /usr/bin/mc mb myminio/virtual-inspections --ignore-existing &&
      /usr/bin/mc anonymous set public myminio/virtual-tours &&
      /usr/bin/mc anonymous set public myminio/virtual-inspections &&
      echo 'MinIO initialization complete!'
      "

  redis:
    image: redis:7-alpine
    container_name: 3d_tour_redis
    restart: unless-stopped
    command: redis-server --maxmemory 128mb --maxmemory-policy noeviction --appendonly yes
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: 3d_tour_backend
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://root:password@db:5432/virtual_tours?schema=public
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MINIO_ENDPOINT=minio
      - MINIO_PORT=9000
      - MINIO_USE_SSL=false
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_PUBLIC_ENDPOINT=197.140.41.131
      - MINIO_PUBLIC_PORT=80
      - JWT_SECRET=supersecret123_production_digital_twin_2026
      - PORT=3000
      - NODE_OPTIONS=--max-old-space-size=1536
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./my-project
      dockerfile: Dockerfile
    container_name: 3d_tour_frontend
    restart: unless-stopped
    environment:
      - VITE_API_URL=/api
      - VITE_MINIO_URL=
      - PORT=3000
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    container_name: 3d_tour_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
      - minio

volumes:
  pgdata:
  miniodata:
  redisdata:
