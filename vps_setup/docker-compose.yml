version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: 3d_tour_db
    restart: always
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: password
      POSTGRES_DB: virtual_tours
    volumes:
      - pgdata:/var/lib/postgresql/data

  minio:
    image: minio/minio
    container_name: 3d_tour_minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_SERVER_URL: "http://197.140.9.103"
      MINIO_BROWSER_REDIRECT_URL: "http://197.140.9.103/minio-console"
    command: server /data --console-address ":9001"
    volumes:
      - miniodata:/data

  minio-init:
    image: minio/mc
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      echo 'Waiting for MinIO...' &&
      sleep 5 &&
      /usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadmin &&
      /usr/bin/mc mb myminio/virtual-tours --ignore-existing &&
      /usr/bin/mc mb myminio/virtual-inspections --ignore-existing &&
      /usr/bin/mc anonymous set public myminio/virtual-tours &&
      /usr/bin/mc anonymous set public myminio/virtual-inspections &&
      echo 'MinIO initialization completed!'
      "

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: 3d_tour_backend
    restart: always
    environment:
      - DATABASE_URL=postgresql://root:password@db:5432/virtual_tours?schema=public
      - MINIO_ENDPOINT=197.140.9.103
      - MINIO_PORT=80
      - MINIO_USE_SSL=false
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - JWT_SECRET=supersecret123
      - PORT=3000
    depends_on:
      - db
      - minio

  frontend:
    build:
      context: ./my-project
      dockerfile: Dockerfile
    container_name: 3d_tour_frontend
    restart: always
    environment:
      - VITE_API_URL=http://197.140.9.103/api
      - PORT=3000
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    container_name: 3d_tour_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
      - minio

volumes:
  pgdata:
  miniodata:
