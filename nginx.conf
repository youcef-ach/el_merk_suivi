# 1. HTTP Server - Redirect everything to HTTPS + ACME challenge
server {
    listen 80;
    server_name azuridtwineup.duckdns.org 197.140.41.131 _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. HTTPS Server - Let's Encrypt SSL & Reverse Proxy
server {
    listen 443 ssl;
    http2 on;
    server_name azuridtwineup.duckdns.org 197.140.41.131 _;

    ssl_certificate /etc/letsencrypt/live/azuridtwineup.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/azuridtwineup.duckdns.org/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 10000M;
    client_body_timeout 600s;
    client_header_timeout 600s;

    resolver 127.0.0.11 valid=30s;

    # Gzip Compression for Performance
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml font/woff font/woff2;

    # Timeouts for Large 3D Uploads and Decimations
    proxy_connect_timeout 600s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;
    send_timeout 600s;

    # Buffer settings
    proxy_buffering on;
    proxy_buffer_size 128k;
    proxy_buffers 8 128k;
    proxy_busy_buffers_size 256k;

    # System Health Check
    location /healthz {
        access_log off;
        return 200 'healthy\n';
    }

    # MinIO Buckets – Host MUST be minio:9000 so presigned S3 URLs validate
    location /virtual-tours/ {
        set $upstream_minio http://minio:9000;
        proxy_pass $upstream_minio;
        proxy_set_header Host minio:9000;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    location /virtual-inspections/ {
        set $upstream_minio http://minio:9000;
        proxy_pass $upstream_minio;
        proxy_set_header Host minio:9000;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    # Backend API & WebSockets
    location /api/ {
        set $upstream_backend http://backend:3000;
        proxy_pass $upstream_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_cache_bypass $http_upgrade;
    }

    # Frontend SSR & Static Assets
    location / {
        set $upstream_frontend http://frontend:3000;
        proxy_pass $upstream_frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_cache_bypass $http_upgrade;
    }
}
