version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: 3d_tour_db
    restart: always
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: password
      POSTGRES_DB: virtual_tours
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  minio:
    image: minio/minio
    container_name: 3d_tour_minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - miniodata:/data

  minio-init:
    image: minio/mc
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      echo 'Waiting for MinIO...' &&
      sleep 5 &&
      /usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadmin &&
      /usr/bin/mc mb myminio/virtual-tours --ignore-existing &&
      /usr/bin/mc anonymous set public myminio/virtual-tours &&
      echo '{\"corsRule\": [{\"allowedOrigin\": [\"*\"], \"allowedHeader\": [\"*\"], \"allowedMethod\": [\"GET\", \"PUT\", \"POST\", \"DELETE\", \"HEAD\"], \"maxAgeSeconds\": 3600}]}' > cors.json &&
      export MC_HOST_myminio=http://minioadmin:minioadmin@minio:9000 &&
      curl -X PUT -H 'Content-Type: application/json' --data-binary @cors.json http://minio:9000/virtual-tours?cors &&
      echo 'MinIO initialization completed!'
      "

volumes:
  pgdata:
  miniodata:
